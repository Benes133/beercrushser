name: Build BEERCRUSHER
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target BEERCRUSHER_VST3 --parallel
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEERCRUSHER-Windows-VST3
          path: build/**/BEERCRUSHER.vst3/**
          if-no-files-found: warn
